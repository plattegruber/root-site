# Deploy from the repository root:
#   fly deploy . --config apps/dental-website-review/fly.toml
# Secrets (not in this file): AUDIT_API_TOKEN, ANALYTICS_SALT, and later
# OPENAI_APPS_CHALLENGE and POSTHOG_API_KEY.
app = "root-dental-website-review"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_MCP = "true"
  PUBLIC_ORIGIN = "https://website-review.root.site"
  EXTRA_HOSTS = "root-dental-website-review.fly.dev"
  CLIENT_IP_HEADER = "fly-client-ip"
  BROWSER_ENABLED = "true"
  PAGESPEED_ENABLED = "false"
  MAX_CONCURRENT_AUDITS = "2"
  CALLER_LIMIT = "40"
  DAILY_TOOL_CALL_LIMIT = "1500"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
