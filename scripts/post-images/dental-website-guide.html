<!doctype html>
<!-- Header image for the guide post: the title on cream, the real cover
     leaning in from the right. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Instrument Serif';
				src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'Instrument Serif';
				font-style: italic;
				src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'Karla';
				src: url('../../node_modules/@fontsource-variable/karla/files/karla-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 200 800;
			}
			html,
			body {
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #f7f4ef;
				color: #1a1715;
				font-family: 'Karla', system-ui, sans-serif;
				position: relative;
				overflow: hidden;
			}
			.accent {
				position: absolute;
				inset: 0 0 auto 0;
				height: 6px;
				background: #a68b70;
				opacity: 0.45;
			}
			.copy {
				position: absolute;
				left: 96px;
				top: 110px;
				width: 600px;
			}
			.kicker {
				font-family: 'IBM Plex Mono', monospace;
				font-size: 16px;
				letter-spacing: 0.04em;
				color: #a68b70;
				text-transform: uppercase;
			}
			h1 {
				margin: 22px 0 0;
				font-family: 'Instrument Serif', Georgia, serif;
				font-weight: 400;
				font-size: 68px;
				line-height: 1.04;
				letter-spacing: -0.015em;
			}
			h1 em {
				color: #a68b70;
			}
			.sub {
				margin: 26px 0 0;
				font-size: 22px;
				line-height: 1.45;
				color: #6b6560;
				max-width: 520px;
			}
			.cover {
				position: absolute;
				right: 72px;
				top: 92px;
				width: 400px;
				height: 518px;
				border-radius: 4px;
				overflow: hidden;
				transform: rotate(4deg);
				box-shadow:
					0 44px 64px -30px rgba(26, 23, 21, 0.5),
					0 0 0 1px rgba(26, 23, 21, 0.08);
			}
			.cover img {
				display: block;
				width: 100%;
				height: 100%;
			}
			.foot {
				position: absolute;
				left: 96px;
				bottom: 54px;
				font-family: 'IBM Plex Mono', monospace;
				font-size: 18px;
				letter-spacing: 0.02em;
				color: #6b6560;
			}
		</style>
	</head>
	<body>
		<div class="accent"></div>
		<div class="copy">
			<div class="kicker">Free guide · 21 pages</div>
			<h1>How to tell if your dental website is doing <em>its job.</em></h1>
			<p class="sub">Five quick checks now. A deeper guide when you need it.</p>
		</div>
		<div class="cover"><img src="../../static/guides/pages/cover.webp" alt="" /></div>
		<div class="foot">root.site</div>
	</body>
</html>
