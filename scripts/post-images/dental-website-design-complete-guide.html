<!doctype html>
<!-- Header image for a pillar guide without photography: the title, set
     large, on the site's cream, with a kicker and the domain. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Instrument Serif';
				src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'Instrument Serif';
				font-style: italic;
				src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
					format('woff2');
			}
			@font-face {
				font-family: 'Karla';
				src: url('../../node_modules/@fontsource-variable/karla/files/karla-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 200 800;
			}
			html,
			body {
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #f7f4ef;
				color: #1a1715;
				font-family: 'Karla', system-ui, sans-serif;
				position: relative;
				overflow: hidden;
			}
			.accent {
				position: absolute;
				inset: 0 0 auto 0;
				height: 6px;
				background: #a68b70;
				opacity: 0.45;
			}
			.copy {
				position: absolute;
				left: 96px;
				right: 96px;
				top: 104px;
			}
			.kicker {
				font-family: 'IBM Plex Mono', monospace;
				font-size: 16px;
				letter-spacing: 0.04em;
				color: #a68b70;
				text-transform: uppercase;
			}
			h1 {
				margin: 26px 0 0;
				max-width: 940px;
				font-family: 'Instrument Serif', Georgia, serif;
				font-weight: 400;
				font-size: 76px;
				line-height: 1.04;
				letter-spacing: -0.015em;
			}
			h1 em {
				font-style: italic;
				color: #a68b70;
			}
			.rule {
				position: absolute;
				left: 96px;
				right: 96px;
				bottom: 100px;
				height: 1px;
				background: #d4cfc7;
			}
			.foot {
				position: absolute;
				left: 96px;
				right: 96px;
				bottom: 54px;
				display: flex;
				justify-content: space-between;
				font-family: 'IBM Plex Mono', monospace;
				font-size: 18px;
				letter-spacing: 0.02em;
				color: #6b6560;
			}
			.foot .brand {
				font-family: 'Instrument Serif', Georgia, serif;
				font-size: 26px;
				color: #1a1715;
				letter-spacing: 0;
			}
		</style>
	</head>
	<body>
		<div class="accent"></div>
		<div class="copy">
			<div class="kicker">Pillar guide · websites</div>
			<h1>Dental website design: <em>the complete guide</em> for practice owners.</h1>
		</div>
		<div class="rule"></div>
		<div class="foot"><span class="brand">root.</span><span>root.site</span></div>
	</body>
</html>
